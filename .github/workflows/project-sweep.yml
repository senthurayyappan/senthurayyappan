name: Add open issues to the project board

on:
  schedule:
    # Roughly 6 AM and 2 PM in Detroit (an hour earlier in winter; close enough).
    # :07 past the hour, off the top of the hour where GitHub's scheduler queue piles up.
    - cron: '7 10,18 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: project-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    env:
      # Classic token with `project` and `repo`. The default GITHUB_TOKEN cannot see
      # user-owned Projects or the private repos linked to one.
      GH_TOKEN: ${{ secrets.ADD_TO_PROJECT_PAT }}
      OWNER: ${{ github.repository_owner }}
      PROJECT: '8'
    steps:
      - name: Add missing issues
        # Plain GraphQL, not `gh project`: that command first probes whether the owner
        # is a user or an org, and the probe fails ("unknown owner type") on a token
        # without read:org.
        run: |
          # The repos to sweep are the ones linked to the board (project settings,
          # "Manage access" / the repo's Projects tab). Linking a repo is all it takes
          # to put its issues on the board; there is no list to keep in sync here.
          project=$(gh api graphql \
            -f query='query($o: String!, $n: Int!) { user(login: $o) { projectV2(number: $n) {
              id repositories(first: 100) { nodes { nameWithOwner } } } } }' \
            -f o="$OWNER" -F n="$PROJECT")
          project_id=$(jq -r '.data.user.projectV2.id' <<< "$project")
          repos=$(jq -r '.data.user.projectV2.repositories.nodes[].nameWithOwner' <<< "$project")

          on_board=$(gh api graphql --paginate \
            -f query='query($o: String!, $n: Int!, $endCursor: String) { user(login: $o) { projectV2(number: $n) {
              items(first: 100, after: $endCursor) { nodes { content { ... on Issue { id } } }
              pageInfo { hasNextPage endCursor } } } } }' \
            -f o="$OWNER" -F n="$PROJECT" \
            --jq '.data.user.projectV2.items.nodes[].content.id // empty')

          added=0
          for repo in $repos; do
            while read -r id url; do
              if ! grep -qxF "$id" <<< "$on_board"; then
                gh api graphql > /dev/null \
                  -f query='mutation($p: ID!, $c: ID!) { addProjectV2ItemById(input: {projectId: $p, contentId: $c}) { item { id } } }' \
                  -f p="$project_id" -f c="$id"
                echo "added $url"
                added=$((added + 1))
              fi
            done < <(gh issue list -R "$repo" --state open --limit 1000 --json id,url --jq '.[] | "\(.id) \(.url)"')
          done
          echo "$added added from $(wc -w <<< "$repos") linked repos"
