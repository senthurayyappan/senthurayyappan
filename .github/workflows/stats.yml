name: Redraw the stat board

on:
  schedule:
    # 06:17 UTC. Off the hour on purpose: GitHub queues scheduled jobs, and the top of
    # the hour is where every cron in the world piles up.
    - cron: '17 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    # An allow-list, not paths-ignore. This job commits back into assets/, and a
    # paths-ignore rule that failed to name every generated file would put the
    # workflow into a loop that retriggers itself forever.
    paths:
      - 'src/**'
      - 'assets/senthur-handwriting.woff'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/stats.yml'

permissions:
  contents: write

# Two runs pushing to main at once would leave one of them rejected. Queue instead.
concurrency:
  group: stat-board
  cancel-in-progress: false

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Redraw
        run: node src/index.js
        env:
          # Needs `repo` scope. Without it the contributions tile silently drops every
          # private contribution -- about 60% of them -- so src/github.js refuses to
          # publish rather than quietly halving the number.
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}

      - name: Commit whatever changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # README.md too: src/index.js rewrites the sentence naming the newest post.
          # It is not in the push trigger's path list above, so committing it here
          # cannot start the job again.
          git add assets README.md
          if git diff --cached --quiet; then
            echo 'nothing moved today'
            exit 0
          fi
          git commit -m 'chore: redraw the stat board'
          git push
